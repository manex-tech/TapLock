name: NEAR Tap checks

on:
  push:
    paths:
      - "near-tap/**"
      - ".github/workflows/near-tap.yml"
  pull_request:
    paths:
      - "near-tap/**"
      - ".github/workflows/near-tap.yml"
  workflow_dispatch:

jobs:
  node-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: near-tap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - run: npm install
      - run: npm run check
